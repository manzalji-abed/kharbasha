<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a2496">
  <title>Kharbasha · خربشة — Draw &amp; guess game in English and Arabic</title>
  <meta name="description" content="Free online draw &amp; guess game for English and Arabic speakers. Open a room, invite friends with a link, then draw, guess and chat live — with voice chat in private rooms.">
  <!-- One address for search engines; invite links (?r=CODE) are the same page. /ar is the Arabic version, served by the Worker. -->
  <link rel="canonical" href="https://kharbasha.abedmanzalji.com/">
  <link rel="alternate" hreflang="en" href="https://kharbasha.abedmanzalji.com/">
  <link rel="alternate" hreflang="ar" href="https://kharbasha.abedmanzalji.com/ar">
  <link rel="alternate" hreflang="x-default" href="https://kharbasha.abedmanzalji.com/">
  <!-- Link previews (WhatsApp, iMessage, Telegram, X, Facebook…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kharbasha · خربشة">
  <meta property="og:title" content="Kharbasha · خربشة — draw &amp; guess with friends">
  <meta property="og:description" content="Live rooms in English and Arabic. Draw, guess and laugh together — with voice chat in private rooms.">
  <meta property="og:url" content="https://kharbasha.abedmanzalji.com/">
  <meta property="og:image" content="https://kharbasha.abedmanzalji.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kharbasha · خربشة — draw, guess and laugh with friends, in English and Arabic">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ar_AR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kharbasha · خربشة — draw &amp; guess with friends">
  <meta name="twitter:description" content="Live rooms in English and Arabic. Draw, guess and laugh together — with voice chat in private rooms.">
  <meta name="twitter:image" content="https://kharbasha.abedmanzalji.com/og-image.jpg">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Kharbasha",
    "alternateName": "خربشة",
    "url": "https://kharbasha.abedmanzalji.com/",
    "description": "Free online draw & guess game for English and Arabic speakers, with live rooms, invite links and voice chat in private rooms.",
    "applicationCategory": "GameApplication",
    "genre": ["Party game", "Drawing game", "Word game"],
    "operatingSystem": "Any (web browser)",
    "inLanguage": ["en", "ar"],
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "image": "https://kharbasha.abedmanzalji.com/og-image.jpg"
  }
  </script>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" id="logo">
      <img src="icon.svg" alt="" width="40" height="40">
      <span class="logo-en">Kharbasha</span>
      <span class="logo-ar" lang="ar">خربشة</span>
    </a>
    <div class="topbar-actions">
      <button class="chip" id="muteBtn" data-i18n-title="sound">🔊</button>
      <button class="chip" id="uiLangBtn">عربي</button>
    </div>
  </header>

  <!-- ============================== HOME ============================== -->
  <main id="home" class="home">
    <section class="card hero">
      <p class="tagline" data-i18n="tagline"></p>

      <div class="invite-banner" id="inviteBanner" hidden>
        <span data-i18n="invitedTo"></span>
        <strong class="invite-room" id="inviteRoom"></strong>
        <small id="inviteMeta"></small>
      </div>

      <div class="avatar-picker">
        <button class="round-btn" id="avPrev" aria-label="Previous avatar">‹</button>
        <button class="avatar big" id="avatar" aria-label="Change avatar">🐱</button>
        <button class="round-btn" id="avNext" aria-label="Next avatar">›</button>
      </div>

      <label class="field">
        <span data-i18n="yourName"></span>
        <input id="nameInput" maxlength="20" dir="auto" autocomplete="nickname" data-i18n-ph="namePh">
      </label>

      <div class="actions" id="mainActions">
        <div class="field">
          <span data-i18n="wordLang"></span>
          <div class="seg" id="langSeg">
            <button data-lang="en" data-i18n="langEn"></button>
            <button data-lang="ar" data-i18n="langAr"></button>
            <button data-lang="both" data-i18n="langBoth"></button>
          </div>
        </div>
        <button class="btn big green" id="playBtn" data-i18n="play"></button>
        <button class="btn yellow" id="createBtn" data-i18n="createRoom"></button>
        <form class="join-row" id="joinForm">
          <input id="codeInput" maxlength="5" autocomplete="off" spellcheck="false" data-i18n-ph="codePh">
          <button class="btn blue" data-i18n="join"></button>
        </form>
      </div>

      <div class="actions" id="inviteActions" hidden>
        <button class="btn big green" id="inviteJoinBtn" data-i18n="joinRoom"></button>
        <button class="link-btn" id="skipInviteBtn" data-i18n="orMain"></button>
      </div>
      <p class="error" id="homeError" role="alert"></p>
    </section>

    <div class="home-side">
      <section class="card rooms">
        <h2 data-i18n="liveRooms"></h2>
        <ul class="room-list" id="roomList"></ul>
      </section>
      <section class="card how">
        <h2 data-i18n="howTitle"></h2>
        <ol>
          <li><span class="how-icon">✏️</span><span data-i18n="how1"></span></li>
          <li><span class="how-icon">💬</span><span data-i18n="how2"></span></li>
          <li><span class="how-icon">⚡</span><span data-i18n="how3"></span></li>
        </ol>
      </section>
      <p class="privacy" data-i18n="privacy"></p>
    </div>
  </main>

  <!-- ============================== ROOM ============================== -->
  <main id="room" class="room" hidden>
    <div class="roombar card">
      <div class="timer" id="timer"></div>
      <div class="room-title">
        <bdi class="room-name" id="roomTitle"></bdi>
        <span class="round-info" id="roundInfo"></span>
      </div>
      <div class="word-area" id="wordArea"></div>
      <div class="room-actions">
        <button class="btn small green" id="voiceBtn" hidden>🎤 <span data-i18n="voiceJoin"></span></button>
        <button class="btn small" id="micBtn" hidden></button>
        <button class="btn small" id="hangupBtn" hidden>📵 <span data-i18n="voiceLeave"></span></button>
        <button class="btn small blue" id="inviteBtn">🔗 <span data-i18n="invite"></span></button>
        <button class="btn small red" id="leaveBtn">🚪 <span data-i18n="leave"></span></button>
      </div>
    </div>

    <aside class="card players">
      <ul class="player-list" id="playerList"></ul>
    </aside>

    <section class="stage" id="stage">
      <div class="board-wrap" id="boardWrap">
        <canvas id="board"></canvas>
        <div class="overlay" id="overlay" hidden>
          <div class="panel lobby-panel" id="lobbyPanel" hidden>
            <h2 data-i18n="lobbyTitle"></h2>
            <div class="settings">
              <label class="wide"><span data-i18n="roomName"></span>
                <input id="setName" maxlength="30" dir="auto" autocomplete="off">
              </label>
              <label><span data-i18n="wordLang"></span>
                <select id="setLang">
                  <option value="en" data-i18n="langEn"></option>
                  <option value="ar" data-i18n="langAr"></option>
                  <option value="both" data-i18n="langBoth"></option>
                </select>
              </label>
              <label><span data-i18n="rounds"></span><select id="setRounds"></select></label>
              <label><span data-i18n="drawTime"></span><select id="setTime"></select></label>
              <label><span data-i18n="maxPlayers"></span><select id="setMax"></select></label>
              <label><span data-i18n="hints"></span><select id="setHints"></select></label>
              <label class="check"><input type="checkbox" id="setPublic"><span data-i18n="publicRoom"></span></label>
              <label class="wide" id="customWrap"><span data-i18n="customWords"></span>
                <textarea id="setCustom" rows="2" dir="auto" maxlength="5000"></textarea>
                <small data-i18n="customHint"></small>
              </label>
              <label class="check wide" id="customOnlyWrap"><input type="checkbox" id="setCustomOnly"><span data-i18n="customOnly"></span></label>
              <p class="wide muted" id="customInfo"></p>
            </div>
            <p class="lobby-status" id="lobbyStatus"></p>
            <button class="btn big green" id="startBtn" data-i18n="start"></button>
          </div>

          <div class="panel" id="choosePanel" hidden>
            <h2 id="chooseTitle"></h2>
            <div class="choices" id="choices"></div>
          </div>

          <div class="panel" id="revealPanel" hidden>
            <p class="reveal-reason" id="revealReason"></p>
            <p class="muted reveal-label" id="revealLabel" data-i18n="theWordWas"></p>
            <div class="reveal-word" id="revealWord"></div>
            <ul class="gains" id="gains"></ul>
            <button class="btn green continue-btn" id="continueBtn"></button>
            <p class="muted reveal-status" id="revealStatus"></p>
          </div>

          <div class="panel" id="overPanel" hidden>
            <h2 data-i18n="gameOver"></h2>
            <ol class="podium" id="podium"></ol>
            <button class="btn big green" id="againBtn" data-i18n="playAgain"></button>
            <p class="muted" id="overStatus"></p>
          </div>
        </div>
      </div>

      <div class="card toolbar" id="toolbar">
        <div class="tools" id="tools" hidden>
          <div class="palette" id="palette"></div>
          <div class="tool-side">
            <div class="sizes" id="sizes"></div>
            <div class="tool-btns">
              <button class="tool" data-tool="pen" data-i18n-title="pen">✏️</button>
              <button class="tool" data-tool="fill" data-i18n-title="fill">🪣</button>
              <button class="tool" data-tool="eraser" data-i18n-title="eraser">🧽</button>
              <button class="tool" id="undoBtn" data-i18n-title="undo">↩️</button>
              <button class="tool" id="clearBtn" data-i18n-title="clear">🗑️</button>
            </div>
          </div>
        </div>
        <p class="watching" id="watching"></p>
      </div>
    </section>

    <aside class="card chat">
      <div class="messages" id="messages" aria-live="polite"></div>
      <form class="chat-form" id="chatForm">
        <input id="chatInput" dir="auto" maxlength="100" autocomplete="off" enterkeyhint="send">
      </form>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
